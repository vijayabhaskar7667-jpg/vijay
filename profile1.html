<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Profiles</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-5">
  <h2 class="text-center mb-4">Student Profiles</h2>
  <div class="row" id="studentContainer">
    <!-- Student cards will be inserted here -->
  </div>
</div>

<script>
  const students = [
    {
      name: "Alice Johnson",
      age: 20,
      course: "Computer Science",
      email: "alice@example.com",
      image: "https://via.placeholder.com/150"
    },
    {
      name: "Bob Smith",
      age: 22,
      course: "Mechanical Engineering",
      email: "bob@example.com",
      image: "https://via.placeholder.com/150"
    },
    {
      name: "Clara Lewis",
      age: 19,
      course: "Graphic Design",
      email: "clara@example.com",
      image: "https://via.placeholder.com/150"
    },
    {
      name: " Lewis",
      age: 19,
      course: "Graphic Design",
      email: "clara@example.com",
      image: "https://via.placeholder.com/150"
    }
  ];

  const container = document.getElementById("studentContainer");

  students.forEach(student => {
    const card = `
      <div class="col-md-4 mb-4">
        <div class="card shadow-sm h-100">
          <img src="${student.image}" class="card-img-top" alt="${student.name}">
          <div class="card-body">
            <h5 class="card-title">${student.name}</h5>
            <p class="card-text">
              <strong>Age:</strong> ${student.age} <br>
              <strong>Course:</strong> ${student.course} <br>
              <strong>Email:</strong> <a href="mailto:${student.email}">${student.email}</a>
            </p>
          </div>
        </div>
      </div>
    `;
    container.insertAdjacentHTML("beforeend", card);
  });
</script>

</body>
</html>
