<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

<div class="container mt-5">
  <div id="profileContainer" class="card mx-auto shadow" style="max-width: 600px;">
    <!-- Student info will be injected here -->
  </div>
</div>

<script>
  const student = JSON.parse(localStorage.getItem("loggedInStudent"));

  if (!student) {
    window.location.href = "login.html";
  } else {
    document.getElementById("profileContainer").innerHTML = `
      <img src="${student.image}" class="card-img-top" alt="${student.name}">
      <div class="card-body">
        <h3 class="card-title">${student.name}</h3>
        <p class="card-text">
          <strong>Email:</strong> ${student.email}<br>
          <strong>Age:</strong> ${student.age}<br>
          <strong>Course:</strong> ${student.course}<br>
        </p>
        <p><strong>Bio:</strong> ${student.bio}</p>
        <a href="login.html" class="btn btn-danger mt-3">Logout</a>
      </div>
    `;
  }
</script>

</body>
</html>
