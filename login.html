<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow p-4">
        <h3 class="text-center mb-4">Student Login</h3>
        <form id="loginForm">
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" required />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required />
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
          <p id="error" class="text-danger mt-3 text-center d-none">Invalid credentials</p>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  const students = [
    {
      hallTicketNumber: "12345",  
      name: "Pranith Gorithyala",
      email: "pranith@example.com",
      password: "pranith123",
      age: 30,
      course: "Computer Science",
      image: "https://via.placeholder.com/150",
      bio: "Working as a digital marketing Manager"
    },
    {
      hallTicketNumber: "22345", 
      name: "vijayabhaskar",
      email: "vijay@example.com",
      password: "vijay123",
      age: 31,
      course: "Bsc computer science",
      image: "https://via.placeholder.com/150",
      bio: "vijay is working as a frontend developer"
    }
  ];

  const form = document.getElementById("loginForm");
  const errorText = document.getElementById("error");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    const foundStudent = students.find(s => s.email === email && s.password === password);

    if (foundStudent) {
      localStorage.setItem("loggedInStudent", JSON.stringify(foundStudent));
      window.location.href = "profile.html";
    } else {
      errorText.classList.remove("d-none");
    }
  });
</script>

</body>
</html>
