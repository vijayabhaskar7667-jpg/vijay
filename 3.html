<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hotel Order System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-light">

  <div class="container py-5">
    <h1 class="text-center mb-4">Hotel Order System</h1>

    <!-- Menu Section -->
    <div class="row mb-4">
      <div class="col-md-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Pizza</h5>
            <p class="card-text">Price: ₹ 250</p>
            <button class="btn btn-primary add-to-cart" data-name="Pizza" data-price="250">Add to Cart</button>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Burger</h5>
            <p class="card-text">Price: ₹ 150</p>
            <button class="btn btn-primary add-to-cart" data-name="Burger" data-price="150">Add to Cart</button>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Pasta</h5>
            <p class="card-text">Price: ₹ 200</p>
            <button class="btn btn-primary add-to-cart" data-name="Pasta" data-price="200">Add to Cart</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Cart Section -->
    <div class="card mb-4">
      <div class="card-body">
        <h4 class="card-title">Cart</h4>
        <div id="cart-content"></div>
        <p class="mt-3 fw-bold">Total: ₹ <span id="cart-total">0</span></p>
        <button class="btn btn-success" onclick="downloadPDF()">Download Order PDF</button>
      </div>
    </div>
  </div>

  <!-- Hidden Order Summary for PDF -->
  <div id="pdf-content" style="display:none;">
    <h2>Hotel Order Summary</h2>
    <ul id="pdf-list"></ul>
    <p><strong>Total:</strong> ₹ <span id="pdf-total"></span></p>
  </div>

  <script>
    let cart = [];

    const cartContent = document.getElementById("cart-content");
    const cartTotal = document.getElementById("cart-total");
    const pdfList = document.getElementById("pdf-list");
    const pdfTotal = document.getElementById("pdf-total");

    document.querySelectorAll(".add-to-cart").forEach(button => {
      button.addEventListener("click", () => {
        const name = button.getAttribute("data-name");
        const price = parseFloat(button.getAttribute("data-price"));

        cart.push({ name, price });
        updateCart();
      });
    });

    function updateCart() {
      cartContent.innerHTML = "";
      pdfList.innerHTML = "";

      let total = 0;

      cart.forEach((item, index) => {
        total += item.price;

        const row = document.createElement("div");
        row.className = "d-flex justify-content-between align-items-center mb-2";
        row.innerHTML = `
          <span>${item.name} - ₹ ${item.price}</span>
          <button class="btn btn-sm btn-danger" onclick="removeFromCart(${index})">Remove</button>
        `;
        cartContent.appendChild(row);

        const li = document.createElement("li");
        li.textContent = `${item.name} - ₹ ${item.price}`;
        pdfList.appendChild(li);
      });

      cartTotal.textContent = total.toFixed(2);
      pdfTotal.textContent = total.toFixed(2);
    }

    function removeFromCart(index) {
      cart.splice(index, 1); // Remove item from array
      updateCart(); // Re-render cart
    }

    function downloadPDF() {
      const element = document.getElementById("pdf-content");
      element.style.display = "block";

      html2pdf()
        .set({
          margin: 1,
          filename: 'hotel-order.pdf',
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2 },
          jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
        })
        .from(element)
        .save()
        .then(() => {
          element.style.display = "none";
        });
    }
  </script>

</body>
</html>
