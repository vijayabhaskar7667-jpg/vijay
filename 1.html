<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f7f7f7;
    }
    .login-box {
      max-width: 400px;
      margin: 80px auto;
      padding: 30px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    .profile {
      display: none;
      margin-top: 40px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="login-box">
    <h3 class="text-center mb-4">Student Login</h3>
    <div id="loginForm">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" class="form-control" />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" />
      </div>
      <button class="btn btn-primary w-100" onclick="login()">Login</button>
      <div id="loginError" class="text-danger mt-2 d-none">Invalid credentials</div>
    </div>
  </div>

  <!-- Student Profile Section -->
  <div class="profile card p-4" id="studentProfile">
    <h4>Welcome, <span id="studentName"></span> 👋</h4>
    <p><strong>Roll No:</strong> <span id="studentRoll"></span></p>
    <p><strong>Email:</strong> <span id="studentEmail"></span></p>
    <p><strong>Course:</strong> <span id="studentCourse"></span></p>
    <button class="btn btn-secondary mt-3" onclick="logout()">Logout</button>
  </div>
</div>

<script>
  // Simulated student database
  const students = [
    {
      username: "vijay",
      password: "vijay1",
      name: "vijayabhaskar",
      roll: "101",
      email: "vijay@example.com",
      course: "Computer Science"
    },
    {
      username: "pranith",
      password: "pra1",
      name: "pranith",
      roll: "102",
      email: "pranith@example.com",
      course: "Mechanical Engineering"
    }
  ];

  function login() {
    const uname = document.getElementById("username").value;
    const pword = document.getElementById("password").value;
    const errorMsg = document.getElementById("loginError");
    const profile = document.getElementById("studentProfile");

    const student = students.find(stu => stu.username === uname && stu.password === pword);

    if (student) {
      document.getElementById("loginForm").style.display = "none";
      profile.style.display = "block";

      // Fill profile info
      document.getElementById("studentName").innerText = student.name;
      document.getElementById("studentRoll").innerText = student.roll;
      document.getElementById("studentEmail").innerText = student.email;
      document.getElementById("studentCourse").innerText = student.course;
    } else {
      errorMsg.classList.remove("d-none");
    }
  }

  function logout() {
    document.getElementById("loginForm").style.display = "block";
    document.getElementById("studentProfile").style.display = "none";
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
    document.getElementById("loginError").classList.add("d-none");
  }
</script>

</body>
</html>
