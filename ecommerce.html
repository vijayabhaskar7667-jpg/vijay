<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Online Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .product-img { height: 200px; object-fit: cover; }
  </style>
</head>
<body class="bg-light">

<!-- Header -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">MyShop</a>
    <div class="ms-auto">
      <button class="btn btn-outline-light" onclick="showCart()">🛒 Cart (<span id="cartCount">0</span>)</button>
    </div>
  </div>
</nav>

<!-- Product List -->
<div class="container mt-5">
  <h2 class="mb-4 text-center">Featured Products</h2>
  <div class="row" id="productList"></div>
</div>

<!-- Cart Modal -->
<div class="modal fade" id="cartModal" tabindex="-1" aria-labelledby="cartModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Your Cart</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="cartItems"></div>
      <div class="modal-footer">
        <h5>Total: $<span id="cartTotal">0</span></h5>
        <button class="btn btn-success" onclick="checkout()">Checkout</button>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap + JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const products = [
    { id: 1, name: "Smartphone", price: 499, image: "https://via.placeholder.com/300x200?text=Smartphone" },
    { id: 2, name: "Laptop", price: 899, image: "https://via.placeholder.com/300x200?text=Laptop" },
    { id: 3, name: "Headphones", price: 199, image: "https://via.placeholder.com/300x200?text=Headphones" },
    { id: 4, name: "Watch", price: 149, image: "https://via.placeholder.com/300x200?text=Watch" },
    { id: 5, name: "Sneakers", price: 79, image: "https://via.placeholder.com/300x200?text=Sneakers" }
  ];

  let cart = [];

  const productList = document.getElementById("productList");
  const cartCount = document.getElementById("cartCount");
  const cartItems = document.getElementById("cartItems");
  const cartTotal = document.getElementById("cartTotal");

  function renderProducts() {
    products.forEach(product => {
      const col = document.createElement("div");
      col.className = "col-md-4 mb-4";
      col.innerHTML = `
        <div class="card shadow-sm">
          <img src="${product.image}" class="card-img-top product-img" alt="${product.name}">
          <div class="card-body">
            <h5 class="card-title">${product.name}</h5>
            <p class="card-text">$${product.price}</p>
            <button class="btn btn-primary w-100" onclick="addToCart(${product.id})">Add to Cart</button>
          </div>
        </div>
      `;
      productList.appendChild(col);
    });
  }

  function addToCart(id) {
    const product = products.find(p => p.id === id);
    const existing = cart.find(item => item.id === id);

    if (existing) {
      existing.qty += 1;
    } else {
      cart.push({ ...product, qty: 1 });
    }

    updateCartDisplay();
  }

  function updateCartDisplay() {
    cartCount.textContent = cart.reduce((sum, item) => sum + item.qty, 0);
  }

  function showCart() {
    const modal = new bootstrap.Modal(document.getElementById("cartModal"));
    renderCartItems();
    modal.show();
  }

  function renderCartItems() {
    cartItems.innerHTML = "";
    let total = 0;

    if (cart.length === 0) {
      cartItems.innerHTML = "<p>Your cart is empty.</p>";
    } else {
      cart.forEach((item, index) => {
        total += item.price * item.qty;
        cartItems.innerHTML += `
          <div class="d-flex justify-content-between align-items-center border-bottom py-2">
            <div>
              <strong>${item.name}</strong><br>
              $${item.price} x ${item.qty}
            </div>
            <div>
              <button class="btn btn-sm btn-danger" onclick="removeItem(${index})">Remove</button>
            </div>
          </div>
        `;
      });
    }

    cartTotal.textContent = total.toFixed(2);
  }

  function removeItem(index) {
    cart.splice(index, 1);
    renderCartItems();
    updateCartDisplay();
  }

  function checkout() {
    if (cart.length === 0) return alert("Cart is empty.");
    alert("Thank you! Your order has been placed.");
    cart = [];
    updateCartDisplay();
    document.getElementById("cartItems").innerHTML = "<p>Your cart is empty.</p>";
    cartTotal.textContent = "0";
  }

  renderProducts();
</script>
</body>
</html>
