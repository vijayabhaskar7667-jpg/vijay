<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hotel Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    emailjs.init('YOUR_PUBLIC_KEY'); // replace with your EmailJS public key
  </script>
</head>
<body>

<div class="container my-5">
  <h2 class="text-center mb-4">Hotel Menu</h2>
  <div class="row" id="menuContainer">
    <!-- Menu items will appear here -->
  </div>

  <hr class="my-4">

  <h4>Your Cart</h4>
  <ul class="list-group mb-3" id="cartList"></ul>
  <p><strong>Total:</strong> $<span id="totalPrice">0</span></p>
  <button class="btn btn-success" onclick="placeOrder()">Place Order</button>

  <div id="confirmation" class="mt-3 text-success fw-bold d-none">
    Order sent to hotel manager!
  </div>
</div>

<script>
  const menu = [
    { id: 1, name: "Chicken Biryani", price: 12 },
    { id: 2, name: "Paneer Butter Masala", price: 10 },
    { id: 3, name: "Tandoori Roti", price: 2 },
    { id: 4, name: "Cold Coffee", price: 3 },
    { id: 5, name: "Gulab Jamun", price: 4 }
  ];

  let cart = [];

  const menuContainer = document.getElementById("menuContainer");
  const cartList = document.getElementById("cartList");
  const totalPriceEl = document.getElementById("totalPrice");

  menu.forEach(item => {
    const card = `
      <div class="col-md-4 mb-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">${item.name}</h5>
            <p class="card-text">$${item.price}</p>
            <button class="btn btn-primary" onclick="addToCart(${item.id})">Add to Cart</button>
          </div>
        </div>
      </div>
    `;
    menuContainer.insertAdjacentHTML("beforeend", card);
  });

  function addToCart(id) {
    const item = menu.find(m => m.id === id);
    cart.push(item);
    renderCart();
  }

  function renderCart() {
    cartList.innerHTML = "";
    let total = 0;

    cart.forEach((item, index) => {
      total += item.price;
      const li = `<li class="list-group-item d-flex justify-content-between align-items-center">
        ${item.name} - $${item.price}
        <button class="btn btn-sm btn-danger" onclick="removeItem(${index})">Remove</button>
      </li>`;
      cartList.insertAdjacentHTML("beforeend", li);
    });

    totalPriceEl.textContent = total;
  }

  function removeItem(index) {
    cart.splice(index, 1);
    renderCart();
  }

  function placeOrder() {
    if (cart.length === 0) {
      alert("Your cart is empty!");
      return;
    }

    const orderDetails = cart.map(item => `${item.name} - $${item.price}`).join('\n');
    const total = cart.reduce((sum, item) => sum + item.price, 0);

    const templateParams = {
      customer_name: "Hotel Customer",
      order_list: orderDetails,
      total_amount: total,
    };

    emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', templateParams)
      .then(() => {
        document.getElementById("confirmation").classList.remove("d-none");
        cart = [];
        renderCart();
      }, (error) => {
        console.error("Failed to send email", error);
        alert("Something went wrong. Please try again.");
      });
  }
</script>

</body>
</html>
