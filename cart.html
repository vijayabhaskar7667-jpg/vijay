<!DOCTYPE html> <!-- HTML5 document type -->
<html lang="en"> <!-- Language set to English -->
<head>
  <meta charset="UTF-8"> <!-- Character encoding set to UTF-8 -->
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Responsive on mobile devices -->
  <title>Simple Shop with Bootstrap 5</title> <!-- Page title shown in browser tab -->

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> <!-- Linking Bootstrap CSS -->
</head>

<body class="bg-light"> <!-- Light gray background color -->

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark"> <!-- Navbar, expands on large screens, dark background -->
  <div class="container"> <!-- Center the content inside navbar -->
    <a class="navbar-brand" href="#">MyShop</a> <!-- Shop logo/name -->
    <button class="btn btn-outline-light ms-auto" onclick="showCart()"> <!-- Cart button aligned to right with margin start auto -->
      🛒 Cart (<span id="cartCount">0</span>) <!-- Cart icon and dynamic cart count -->
    </button>
  </div> <!-- End container -->
</nav> <!-- End Navbar -->

<!-- Products Section -->
<div class="container my-5"> <!-- Container for products with vertical margin -->
  <h2 class="text-center mb-4">Products</h2> <!-- Heading centered with bottom margin -->
  <div class="row" id="productList"></div> <!-- Row for products; will be filled by JavaScript -->
</div> <!-- End container -->

<!-- Cart Modal (Popup Window) -->
<div class="modal fade" id="cartModal" tabindex="-1"> <!-- Bootstrap modal, hidden initially -->
  <div class="modal-dialog"> <!-- Modal dialog box -->
    <div class="modal-content"> <!-- Modal content area -->

      <!-- Modal Header -->
      <div class="modal-header"> <!-- Top section of modal -->
        <h5 class="modal-title">Your Cart</h5> <!-- Modal title -->
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button> <!-- Close (X) button -->
      </div>

      <!-- Modal Body -->
      <div class="modal-body"> <!-- Main body area of modal -->
        <div id="cartItems"></div> <!-- Cart items list will be injected here -->
        <div class="mt-3"> <!-- Margin top 3 for spacing -->
          <strong>Total: $<span id="cartTotal">0</span></strong> <!-- Bold text showing total price -->
        </div>
      </div> <!-- End modal-body -->

      <!-- Modal Footer -->
      <div class="modal-footer flex-column align-items-start"> <!-- Footer area, items stacked vertically and aligned to start -->

        <!-- Payment Method Section -->
        <div class="w-100 mb-2"> <!-- Full width and bottom margin -->
          <div class="form-check"> <!-- Bootstrap custom checkbox/radio wrapper -->
            <input class="form-check-input" type="radio" name="payment" value="cod" id="codOption" checked> <!-- Radio button for Cash on Delivery, selected by default -->
            <label class="form-check-label" for="codOption">Cash on Delivery</label> <!-- Label for the radio -->
          </div>

          <div class="form-check"> <!-- Another payment option -->
            <input class="form-check-input" type="radio" name="payment" value="upi" id="upiOption"> <!-- Radio button for UPI payment -->
            <label class="form-check-label" for="upiOption">Pay with UPI</label> <!-- Label for UPI option -->
          </div>

          <input type="text" id="upiInput" class="form-control mt-2" placeholder="Enter your UPI ID" style="display: none;"> <!-- UPI ID text input, hidden initially -->
        </div>

        <!-- Place Order Button -->
        <button class="btn btn-success w-100" onclick="checkout()">Place Order</button> <!-- Full-width green button to checkout -->
      </div> <!-- End modal-footer -->

    </div> <!-- End modal-content -->
  </div> <!-- End modal-dialog -->
</div> <!-- End modal -->

<!-- Bootstrap 5 JS (Bundle includes Popper.js) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> <!-- Bootstrap JavaScript -->

<!-- JavaScript Logic -->
<script>
// ================== JavaScript Section ===================

// List of available products
const products = [
  { id: 1, name: "Phone", price: 300 }, // Product 1
  { id: 2, name: "Laptop", price: 800 }, // Product 2
  { id: 3, name: "Watch", price: 150 } // Product 3
];

// Cart array to store added products
let cart = []; // Empty cart initially

// Function to display products dynamically
function renderProducts() {
  const productList = document.getElementById('productList'); // Get the products container

  // Create product cards dynamically
  productList.innerHTML = products.map(product => `
    <div class="col-md-4 mb-4"> <!-- 4 columns wide on medium+ screens, bottom margin -->
      <div class="card h-100 text-center p-3"> <!-- Bootstrap card, height 100% to make buttons stay bottom, text centered, padding 3 -->
        <h5 class="card-title">${product.name}</h5> <!-- Product name -->
        <p class="card-text">$${product.price}</p> <!-- Product price -->
        <button class="btn btn-primary mt-auto" onclick="addToCart(${product.id})">Add to Cart</button> <!-- Button to add product to cart -->
      </div>
    </div>
  `).join(''); // Convert array into HTML string
}

// Function to add product into the cart
function addToCart(id) {
  const product = products.find(p => p.id === id); // Find the product by id
  cart.push(product); // Add to cart array
  document.getElementById('cartCount').textContent = cart.length; // Update cart count number
}

// Function to show cart modal popup
function showCart() {
  const modal = new bootstrap.Modal(document.getElementById('cartModal')); // Create a Bootstrap modal
  renderCart(); // Load cart items inside the modal
  modal.show(); // Show the modal
}

// Function to render cart items and total amount
function renderCart() {
  const cartItems = document.getElementById('cartItems'); // Get cart items container
  cartItems.innerHTML = cart.map(item => `<p>${item.name} - $${item.price}</p>`).join(''); // List all items
  const total = cart.reduce((sum, item) => sum + item.price, 0); // Sum up all product prices
  document.getElementById('cartTotal').textContent = total; // Update total price
}

// Show/hide UPI input based on selected payment option
document.querySelectorAll('input[name="payment"]').forEach(radio => { // For each payment radio button
  radio.addEventListener('change', function () { // When payment method changes
    document.getElementById('upiInput').style.display = (this.value === 'upi') ? 'block' : 'none'; // Show UPI input if UPI selected
  });
});

// Function to place the order
function checkout() {
  const paymentMethod = document.querySelector('input[name="payment"]:checked').value; // Get selected payment method
  const upiId = document.getElementById('upiInput').value.trim(); // Get UPI ID input if filled

  // Check if UPI is selected but no UPI ID entered
  if (paymentMethod === 'upi' && !upiId) {
    alert('Please enter your UPI ID.'); // Alert user to fill UPI ID
    return; // Stop execution
  }

  // Show order placed message
  alert(paymentMethod === 'upi'
    ? `Order placed! Pay to UPI ID: ${upiId}` // If UPI, show UPI ID
    : 'Order placed! Pay on delivery.'); // If COD

  // Reset cart after checkout
  cart = []; // Clear cart array
  document.getElementById('cartCount').textContent = 0; // Reset cart count
  document.getElementById('cartItems').innerHTML = ''; // Clear cart items
  document.getElementById('cartTotal').textContent = 0; // Reset total price
}

// When page loads, show products
renderProducts(); // Call the function to display products
</script>

</body>
</html>
